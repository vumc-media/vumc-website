backend:
  name: github
  repo: vumc-media/vumc-website
  branch: main
  base_url: https://vumc-sveltia-cms-auth.versaillesumcworshipteam.workers.dev

media_folder: "/vumc-media"
public_folder: "/vumc-media"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Edit Homepage"
        name: "home"
        file: "content/home.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Show Hero", name: "enabled", widget: "boolean", default: true }
              - label: "Hero Images"
                name: "images"
                widget: "list"
                required: false
                label_singular: "Hero Image"
                summary: "{{fields.image}}"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Image Description", name: "alt", widget: "string", required: false }
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Buttons"
                name: "buttons"
                widget: "list"
                required: false
                label_singular: "Button"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Show Button", name: "enabled", widget: "boolean", default: true }
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Button Link", name: "link", widget: "string" }
                  - label: "Button Style"
                    name: "style"
                    widget: "select"
                    options:
                      - { label: "Gold", value: "primary" }
                      - { label: "Outline", value: "secondary" }
                      - { label: "White", value: "light" }
                      - { label: "Dark", value: "dark" }

          - label: "Community Stories"
            name: "community_stories"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Background Image", name: "image", widget: "image", required: false }
              - { label: "Small Heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Buttons"
                name: "buttons"
                widget: "list"
                required: false
                label_singular: "Button"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Show Button", name: "enabled", widget: "boolean", default: true }
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Button Link", name: "link", widget: "string" }
                  - label: "Button Style"
                    name: "style"
                    widget: "select"
                    options:
                      - { label: "Gold", value: "primary" }
                      - { label: "Outline", value: "secondary" }
                      - { label: "White", value: "light" }
                      - { label: "Dark", value: "dark" }

          - label: "Who We Are"
            name: "who_we_are"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Feature Image", name: "image", widget: "image", required: false }
              - { label: "Small Heading", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - label: "Buttons"
                name: "buttons"
                widget: "list"
                required: false
                label_singular: "Button"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Show Button", name: "enabled", widget: "boolean", default: true }
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Button Link", name: "link", widget: "string" }
                  - label: "Button Style"
                    name: "style"
                    widget: "select"
                    options:
                      - { label: "Gold", value: "primary" }
                      - { label: "Outline", value: "secondary" }
                      - { label: "White", value: "light" }
                      - { label: "Dark", value: "dark" }

          - label: "Custom Homepage Boxes"
            name: "custom_boxes"
            widget: "list"
            required: false
            add_to_top: true
            label_singular: "Homepage Box"
            summary: "{{fields.title}}"
            fields:
              - { label: "Show Box", name: "enabled", widget: "boolean", default: true }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Image Description", name: "alt", widget: "string", required: false }
              - { label: "Small Heading", name: "eyebrow", widget: "string", required: false }
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text", required: false }
              - label: "Buttons"
                name: "buttons"
                widget: "list"
                required: false
                label_singular: "Button"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Show Button", name: "enabled", widget: "boolean", default: true }
                  - { label: "Button Text", name: "text", widget: "string" }
                  - { label: "Button Link", name: "link", widget: "string" }
                  - label: "Button Style"
                    name: "style"
                    widget: "select"
                    options:
                      - { label: "Gold", value: "primary" }
                      - { label: "Outline", value: "secondary" }
                      - { label: "White", value: "light" }
                      - { label: "Dark", value: "dark" }
