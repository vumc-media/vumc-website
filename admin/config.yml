backend:
  name: github
  repo: vumc-media/vumc-website
  branch: main
  base_url: https://sveltia-cms-auth.vercel.app

media_folder: "vumc-media"
public_folder: "/vumc-media"

collections:
  - name: "homepage"
    label: "Homepage Content"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/home.json"
        fields:
          - label: "Hero Title"
            name: "hero_title"
            widget: "string"

          - label: "Hero Subtitle"
            name: "hero_subtitle"
            widget: "text"

          - label: "Button Text"
            name: "button_text"
            widget: "string"

          - label: "Button Link"
            name: "button_link"
            widget: "string"
