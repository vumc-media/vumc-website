<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VUMC Website Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

  <script>
CMS.registerPreviewStyle(`      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: #172033;
        font-family: Arial, Helvetica, sans-serif;
      }

      .vumc-preview {
        min-height: 100vh;
        background: #fff;
      }

      /* HERO */

      .vumc-hero {
        position: relative;
        min-height: 540px;
        display: flex;
        align-items: center;
        overflow: hidden;
        background: #0b2a52;
        color: white;
      }

      .vumc-hero-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .vumc-hero-overlay {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            rgba(4,19,38,.95) 0%,
            rgba(7,31,61,.78) 50%,
            rgba(7,31,61,.35) 100%
          );
      }

      .vumc-hero-content {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 1100px;
        margin: auto;
        padding: 70px 42px;
      }

      .vumc-kicker {
        margin-bottom: 14px;
        color: #dce9f6;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .vumc-hero h1 {
        max-width: 760px;
        margin: 0 0 14px;
        font-size: clamp(38px, 6vw, 68px);
        line-height: 1;
        letter-spacing: -2px;
      }

      .vumc-hero h2 {
        max-width: 720px;
        margin: 0 0 22px;
        color: #dfeaf5;
        font-size: clamp(20px, 3vw, 29px);
        line-height: 1.2;
        font-weight: 500;
      }

      .vumc-hero p {
        max-width: 720px;
        margin: 0;
        color: rgba(255,255,255,.92);
        font-size: 17px;
        line-height: 1.7;
      }

      .vumc-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      .vumc-button {
        display: inline-block;
        padding: 13px 20px;
        border-radius: 9px;
        background: #0b2a52;
        color: white;
        font-size: 14px;
        font-weight: 700;
      }

      .vumc-hero .vumc-button {
        background: white;
        color: #0b2a52;
      }

      .vumc-hero .vumc-button.secondary {
        border: 1px solid rgba(255,255,255,.6);
        background: rgba(255,255,255,.12);
        color: white;
      }

      .hero-count {
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 3;
        padding: 7px 11px;
        border-radius: 20px;
        background: rgba(0,0,0,.55);
        color: white;
        font-size: 11px;
      }

      /* SECTIONS */

      .vumc-section {
        padding: 65px 42px;
      }

      .vumc-container {
        max-width: 1100px;
        margin: auto;
      }

      .vumc-eyebrow {
        margin-bottom: 8px;
        color: #3f7a5a;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .vumc-section h2 {
        margin: 0 0 16px;
        color: #0b2a52;
        font-size: 35px;
        line-height: 1.1;
      }

      .vumc-section p {
        margin: 0;
        color: #4c596b;
        font-size: 16px;
        line-height: 1.7;
      }

      /* COMMUNITY */

      .community-section {
        background: #f5f7f9;
      }

      .community-card {
        display: grid;
        grid-template-columns: .85fr 1.15fr;
        overflow: hidden;
        border-radius: 18px;
        background: white;
        box-shadow: 0 10px 35px rgba(0,0,0,.08);
      }

      .community-image {
        min-height: 310px;
        background: #dfe5eb;
      }

      .community-image img {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 310px;
        object-fit: cover;
      }

      .community-content {
        padding: 44px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .community-content .vumc-button {
        align-self: flex-start;
        margin-top: 24px;
      }

      /* WHO WE ARE */

      .who-grid {
        display: grid;
        grid-template-columns: 1.1fr .9fr;
        gap: 42px;
        align-items: center;
      }

      .who-image {
        overflow: hidden;
        min-height: 300px;
        border-radius: 18px;
        background: #e3e7eb;
      }

      .who-image img {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 300px;
        object-fit: cover;
      }

      .image-placeholder {
        min-height: 280px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        background: linear-gradient(135deg,#e7ebef,#d8dee5);
        color: #7c8794;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
      }

      /* CUSTOM BOXES */

      .custom-section {
        background: #0b2a52;
      }

      .custom-section .vumc-eyebrow {
        color: #b9d6c3;
      }

      .custom-section h2 {
        color: white;
      }

      .custom-grid {
        display: grid;
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 22px;
        margin-top: 28px;
      }

      .custom-card {
        overflow: hidden;
        border-radius: 16px;
        background: white;
      }

      .custom-card-image {
        height: 210px;
        background: #e3e7eb;
      }

      .custom-card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .custom-card-body {
        padding: 25px;
      }

      .custom-card h3 {
        margin: 0 0 10px;
        color: #0b2a52;
        font-size: 23px;
      }

      .custom-card p {
        margin-bottom: 18px;
      }

      .preview-empty {
        padding: 40px;
        border: 2px dashed rgba(255,255,255,.25);
        border-radius: 15px;
        color: rgba(255,255,255,.75);
        text-align: center;
      }

      @media (max-width: 700px) {
        .community-card,
        .who-grid,
        .custom-grid {
          grid-template-columns: 1fr;
        }

        .vumc-section {
          padding: 45px 22px;
        }

        .vumc-hero-content {
          padding: 55px 24px;
        }
      }
    `);


    const HomePreview = createClass({

      render: function () {

        const entry = this.props.entry;
        const getAsset = this.props.getAsset;

        const hero = entry.getIn(['data', 'hero']) || {};
        const stories =
          entry.getIn(['data', 'community_stories']) || {};
        const who =
          entry.getIn(['data', 'who_we_are']) || {};
        const boxes =
          entry.getIn(['data', 'custom_boxes']) || [];

        const heroImages =
          Array.isArray(hero.images) ? hero.images : [];

        const visibleBoxes =
          Array.isArray(boxes)
            ? boxes.filter(function (box) {
                return box && box.enabled !== false;
              })
            : [];


        /* -----------------------------
           IMAGE RESOLVER
        ----------------------------- */

        const assetURL = function (path) {

          if (!path) return '';

          const asset = getAsset(path);

          if (!asset) return '';

          return asset.url || '';

        };


        /* -----------------------------
           HERO
        ----------------------------- */

        let heroElement = null;

        if (hero.enabled !== false) {

          const firstImage =
            heroImages.length
              ? assetURL(heroImages[0].image)
              : '';

          heroElement = h(
            'section',
            { className: 'vumc-hero' },

            firstImage
              ? h('img', {
                  className: 'vumc-hero-image',
                  src: firstImage,
                  alt: heroImages[0].alt || ''
                })
              : null,

            h('div', {
              className: 'vumc-hero-overlay'
            }),

            h(
              'div',
              { className: 'vumc-hero-content' },

              h(
                'div',
                { className: 'vumc-kicker' },
                'Versailles, Kentucky • In Person & Online'
              ),

              h(
                'h1',
                {},
                hero.title ||
                  'Versailles United Methodist Church'
              ),

              h(
                'h2',
                {},
                hero.subtitle || ''
              ),

              h(
                'p',
                {},
                hero.text || ''
              ),

              h(
                'div',
                { className: 'vumc-buttons' },

                hero.primary_button_text
                  ? h(
                      'span',
                      { className: 'vumc-button' },
                      hero.primary_button_text
                    )
                  : null,

                hero.secondary_button_text
                  ? h(
                      'span',
                      {
                        className:
                          'vumc-button secondary'
                      },
                      hero.secondary_button_text
                    )
                  : null
              )
            ),

            h(
              'div',
              { className: 'hero-count' },
              heroImages.length +
                (heroImages.length === 1
                  ? ' hero image'
                  : ' hero images')
            )
          );
        }


        /* -----------------------------
           COMMUNITY STORIES
        ----------------------------- */

        let storiesElement = null;

        if (stories.enabled !== false) {

          const image =
            assetURL(stories.image);

          storiesElement = h(
            'section',
            {
              className:
                'vumc-section community-section'
            },

            h(
              'div',
              { className: 'vumc-container' },

              h(
                'div',
                { className: 'community-card' },

                h(
                  'div',
                  { className: 'community-image' },

                  image
                    ? h('img', {
                        src: image,
                        alt: ''
                      })
                    : h(
                        'div',
                        {
                          className:
                            'image-placeholder'
                        },
                        'Community Stories Image'
                      )
                ),

                h(
                  'div',
                  {
                    className:
                      'community-content'
                  },

                  h(
                    'div',
                    { className: 'vumc-eyebrow' },
                    stories.eyebrow ||
                      'Community Stories'
                  ),

                  h(
                    'h2',
                    {},
                    stories.title || ''
                  ),

                  h(
                    'p',
                    {},
                    stories.text || ''
                  ),

                  stories.button_text
                    ? h(
                        'span',
                        {
                          className:
                            'vumc-button'
                        },
                        stories.button_text
                      )
                    : null
                )
              )
            )
          );
        }


        /* -----------------------------
           WHO WE ARE
        ----------------------------- */

        let whoElement = null;

        if (who.enabled !== false) {

          const image =
            assetURL(who.image);

          whoElement = h(
            'section',
            { className: 'vumc-section' },

            h(
              'div',
              {
                className:
                  'vumc-container who-grid'
              },

              h(
                'div',
                {},

                h(
                  'div',
                  { className: 'vumc-eyebrow' },
                  who.eyebrow || 'Who We Are'
                ),

                h(
                  'h2',
                  {},
                  who.title || ''
                ),

                h(
                  'p',
                  {},
                  who.text || ''
                )
              ),

              h(
                'div',
                { className: 'who-image' },

                image
                  ? h('img', {
                      src: image,
                      alt: ''
                    })
                  : h(
                      'div',
                      {
                        className:
                          'image-placeholder'
                      },
                      'Who We Are Image'
                    )
              )
            )
          );
        }


        /* -----------------------------
           CUSTOM BOXES
        ----------------------------- */

        const boxElements =
          visibleBoxes.map(function (box, index) {

            const image =
              assetURL(box.image);

            return h(
              'article',
              {
                className: 'custom-card',
                key: index
              },

              h(
                'div',
                {
                  className:
                    'custom-card-image'
                },

                image
                  ? h('img', {
                      src: image,
                      alt: box.alt || ''
                    })
                  : h(
                      'div',
                      {
                        className:
                          'image-placeholder'
                      },
                      'Homepage Box Image'
                    )
              ),

              h(
                'div',
                {
                  className:
                    'custom-card-body'
                },

                h(
                  'h3',
                  {},
                  box.title ||
                    'Homepage Box'
                ),

                box.text
                  ? h(
                      'p',
                      {},
                      box.text
                    )
                  : null,

                box.button_text
                  ? h(
                      'span',
                      {
                        className:
                          'vumc-button'
                      },
                      box.button_text
                    )
                  : null
              )
            );

          });


        const customElement = h(
          'section',
          {
            className:
              'vumc-section custom-section'
          },

          h(
            'div',
            { className: 'vumc-container' },

            h(
              'div',
              { className: 'vumc-eyebrow' },
              'Homepage Features'
            ),

            h(
              'h2',
              {},
              'Custom Homepage Boxes'
            ),

            boxElements.length
              ? h(
                  'div',
                  { className: 'custom-grid' },
                  ...boxElements
                )
              : h(
                  'div',
                  { className: 'preview-empty' },
                  'Add a homepage box in the editor to preview it here.'
                )
          )
        );


        /* -----------------------------
           FINAL PREVIEW
        ----------------------------- */

        return h(
          'main',
          { className: 'vumc-preview' },

          heroElement,
          storiesElement,
          whoElement,
          customElement
        );
      }
    });


    /*
     * IMPORTANT:
     * "home" is the file name in config.yml.
     */
    CMS.registerPreviewTemplate(
      'home',
      HomePreview
    );

  </script>
</head>

<body></body>
</html>
