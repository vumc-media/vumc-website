<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VUMC Website Editor</title>

<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

<script>
CMS.registerPreviewStyle(`
:root{
  --bg:#f7f4ef;
  --surface:#ffffff;
  --surface-soft:#f1ece4;
  --text:#1f242c;
  --muted:#5b6470;
  --dark:#11161d;
  --dark-soft:#171d25;
  --accent:#bb8c3f;
  --accent-soft:#e3c991;
  --border:rgba(17,22,29,.10);
  --shadow:0 18px 50px rgba(17,22,29,.12);
  --radius-xl:28px;
  --radius-lg:20px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.vumc-preview{
  background:var(--bg);
  min-height:100vh;
}

.container{
  width:min(1120px,calc(100% - 48px));
  margin:0 auto;
}

.section{
  padding:72px 0;
}

.eyebrow{
  margin-bottom:10px;

}

.section-title{
  margin:0 0 14px;

}

}

.btn-row{

  flex-wrap:wrap;
  gap:12px;

}

.btn{

  align-items:center;

}

.btn-primary{

/* =========================================================
   REAL HOMEPAGE HERO
========================================================= */

.hero{
  position:relative;
  overflow:hidden;
  min-height:640px;
  display:flex;
  align-items:center;
  color:#fff;

}

.hero-slideshow{

.hero > .container{

.glass-card p{

.service-times{

.service-time{

}

.hero-image-note{
  position:absolute;
  right:16px;
  bottom:15px;
  z-index:5;
  padding:7px 11px;

}


/* =========================================================
   COMMUNITY STORIES — MATCHES CURRENT HOMEPAGE
========================================================= */

.community-stories-section{

.community-story-card{

  color:#fff;

}

.community-story-card::before{

.community-story-highlight{

}

.story-label{

  margin-bottom:14px;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(187,140,63,.95);
  color:#fff;
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.community-story-highlight h3{
  margin:0 0 10px;
  font-size:24px;
  line-height:1.18;
}

.community-story-highlight p{
  margin:0;
  color:rgba(255,255,255,.80);
  font-size:15px;
  line-height:1.55;
}


/* =========================================================
   PROTECTED / AUTOMATED WEBSITE SECTIONS
========================================================= */

.automatic-section{
  padding:58px 0;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.automatic-card{
  padding:28px;
  border:1px solid var(--border);
  border-radius:22px;
  background:var(--surface-soft);
}

.automatic-label{
  display:inline-flex;
  margin-bottom:10px;

.cms-custom-section{

/* =========================================================
   HOMEPAGE PREVIEW
========================================================= */

const HomePreview=createClass({

  render:function(){

    const entry=this.props.entry;
    const getAsset=this.props.getAsset;

    const hero=entry.getIn(["data","hero"]) || {};
    const stories=entry.getIn(["data","community_stories"]) || {};
    const who=entry.getIn(["data","who_we_are"]) || {};
    const customBoxes=entry.getIn(["data","custom_boxes"]) || [];

    const defaultHeroImages=[
      "/vumc-media/worship.webp",
      "/vumc-media/Rooted-Youth-Ministry.webp",
      "/vumc-media/candlelight.webp",
      "/vumc-media/IMG_4011.webp",
      "/vumc-media/praiseteam8.webp",
      "/vumc-media/Sprouts.webp",
      "/vumc-media/493610968_1091241349711985_6048390933452425157_n (1).webp"
    ];

    function assetURL(path){
      if(!path) return "";

      try{
        const asset=getAsset(path);

        if(asset && asset.url){
          return asset.url;
        }
      }catch(e){}

      return path;
    }


    /* =====================================================
       HERO IMAGE LOGIC

       No CMS images:
       use current real homepage images.

       CMS images added:
       use those instead.
    ===================================================== */

    let selectedHeroImages=[];

    if(Array.isArray(hero.images) && hero.images.length){
      selectedHeroImages=hero.images
        .filter(item=>item && item.image)
        .map(item=>({
          image:assetURL(item.image),
          alt:item.alt || ""
        }));
    }

    const usingDefaults=!selectedHeroImages.length;

    const finalHeroImages=usingDefaults
      ? defaultHeroImages.map(path=>({
          image:path,
          alt:"Versailles United Methodist Church"
        }))
      : selectedHeroImages;


    const heroSlides=finalHeroImages.map(function(item,index){

      return h("div",{
        key:"hero-"+index,
        className:
          "hero-slide"+(index===0 ? " active" : ""),
        style:{
          backgroundImage:
            'url("'+item.image+'")'
        }
      });

    });


    /* =====================================================
       HERO
    ===================================================== */

    let heroElement=null;

    if(hero.enabled!==false){

      heroElement=h(
        "section",
        {className:"hero"},

        h(
          "div",
          {className:"hero-slideshow"},
          ...heroSlides
        ),

        h("div",{className:"hero-overlay"}),

        h(
          "div",
          {className:"container"},

          h(
            "div",
            {className:"hero-grid"},

            h(
              "div",
              {className:"hero-panel"},

              h(
                "div",
                {className:"hero-kicker"},
                "Versailles, Kentucky • In Person & Online"
              ),

              h(
                "h1",
                {},
                hero.title ||
                "Versailles United Methodist Church"
              ),

              h(
                "h2",
                {},
                hero.subtitle ||
                "A Welcoming Church in Versailles, Kentucky"
              ),

              h(
                "p",
                {},
                hero.text ||
                "We are a church in Versailles, Kentucky seeking to Love Like Jesus through worship, connection, service, and spiritual growth."
              ),

              h(
                "div",
                {className:"btn-row"},

                hero.primary_button_text
                  ? h(
                      "span",
                      {className:"btn btn-primary"},
                      hero.primary_button_text
                    )
                  : null,

                hero.secondary_button_text
                  ? h(
                      "span",
                      {className:"btn btn-secondary"},
                      hero.secondary_button_text
                    )
                  : null,

                h(
                  "span",
                  {className:"btn btn-secondary"},
                  "Who We Are"
                ),

                h(
                  "span",
                  {className:"btn btn-light"},
                  "Subscribe"
                )
              )
            ),

            h(
              "div",
              {className:"hero-side"},

              h(
                "div",
                {className:"glass-card worship-card"},

                h("h3",{},"Sunday Worship"),

                h(
                  "p",
                  {},
                  "Worship schedule is automatically managed from the church calendar."
                ),

                h(
                  "div",
                  {className:"service-times"},

                  h(
                    "div",
                    {className:"service-time"},
                    h("strong",{},"Traditional Worship"),
                    h("span",{},"9:30 AM")
                  ),

                  h(
                    "div",
                    {className:"service-time"},
                    h("strong",{},"Contemporary Worship"),
                    h("span",{},"10:30 AM")
                  )
                )
              ),

              h(
                "div",
                {className:"glass-card"},

                h("h3",{},"Take Your Next Step"),

                h(
                  "p",
                  {},
                  "Join us in person, worship online, find your place to connect, or discover ways to serve in ministry and community."
                )
              )
            )
          )
        ),

        h(
          "div",
          {className:"hero-image-note"},

          usingDefaults
            ? "Using current website hero images"
            : finalHeroImages.length +
              " CMS hero image" +
              (finalHeroImages.length===1 ? "" : "s")
        )
      );
    }


    /* =====================================================
       COMMUNITY STORIES

       Default is the real current background.
       If CMS image is selected, it overrides it.
    ===================================================== */

    let communityElement=null;

    if(stories.enabled!==false){

      const communityImage=
        stories.image
          ? assetURL(stories.image)
          : "/vumc-media/church-picnic.webp";

      communityElement=h(
        "section",
        {className:"community-stories-section"},

        h(
          "div",
          {className:"container"},

          h(
            "div",
            {
              className:"community-story-card",
              style:{
                backgroundImage:
                  "linear-gradient(135deg,rgba(17,22,29,.88),rgba(17,22,29,.48)),"+
                  "radial-gradient(circle at top right,rgba(187,140,63,.28),transparent 34%),"+
                  'url("'+communityImage+'")'
              }
            },

            h(
              "div",
              {className:"community-story-content"},

              h(
                "div",
                {
                  className:"eyebrow",
                  style:{color:"var(--accent-soft)"}
                },
                stories.eyebrow ||
                "Community Stories"
              ),

              h(
                "h2",
                {},
                stories.title ||
                "Real stories from life at VUMC."
              ),

              h(
                "p",
                {},
                stories.text ||
                "Stories from guests, members, and neighbors help show what it means to Love Like Jesus through worship, welcome, fellowship, service, and community in Versailles, Kentucky."
              ),

              h(
                "div",
                {className:"btn-row"},

                h(
                  "span",
                  {className:"btn btn-primary"},
                  stories.button_text ||
                  "Read Community Stories"
                ),

                h(
                  "span",
                  {className:"btn btn-secondary"},
                  "Tammy’s First Visit"
                )
              )
            ),

            h(
              "div",
              {className:"community-story-highlight"},

              h(
                "span",
                {className:"story-label"},
                "Featured Story"
              ),

              h(
                "h3",
                {},
                "A First Visit That Became Fellowship"
              ),

              h(
                "p",
                {},
                "Tammy visited worship, stayed for the church picnic, checked in on Facebook, and shared a reflection about feeling welcomed at Versailles UMC."
              )
            )
          )
        )
      );
    }


    /* =====================================================
       PROTECTED DYNAMIC SECTIONS

       These are visible in the preview so the editor sees
       their place in the page, but CMS cannot alter them.
    ===================================================== */

    const protectedSections=h(
      "section",
      {className:"automatic-section"},

      h(
        "div",
        {className:"container"},

        h(
          "div",
          {className:"automatic-card"},

          h(
            "span",
            {className:"automatic-label"},
            "Automatic Website Content"
          ),

          h(
            "h2",
            {},
            "Livestream, latest worship & featured events"
          ),

          h(
            "p",
            {},
            "These sections continue to populate automatically from the existing VUMC systems. They are shown here as protected content and are not changed by the homepage editor."
          )
        )
      )
    );


    /* =====================================================
       WHO WE ARE
    ===================================================== */

    let whoElement=null;

    if(who.enabled!==false){

      const whoImage=
        who.image
          ? assetURL(who.image)
          : "/vumc-media/atrium.webp";

      whoElement=h(
        "section",
        {
          className:"section",
          id:"who-we-are"
        },

        h(
          "div",
          {className:"container"},

          h(
            "div",
            {className:"two-column"},

            h(
              "div",
              {className:"content-card"},

              h(
                "div",
                {className:"eyebrow"},
                who.eyebrow ||
                "Who We Are"
              ),

              h(
                "h2",
                {className:"section-title"},
                who.title ||
                "More than a church. A calling."
              ),

              h(
                "p",
                {className:"section-copy"},
                who.text ||
                "At Versailles United Methodist Church, we are striving to Love Like Jesus. That means loving God, loving people, and living out our faith in real, everyday ways."
              ),

              h(
                "div",
                {className:"btn-row"},

                h(
                  "span",
                  {className:"btn btn-primary"},
                  "What Does That Mean?"
                )
              )
            ),

            h(
              "div",
              {
                className:"event-card",
                style:{
                  backgroundImage:
                    "linear-gradient(135deg,rgba(17,22,29,.82),rgba(17,22,29,.42)),"+
                    'url("'+whoImage+'")'
                }
              },

              h(
                "div",
                {className:"event-content"},

                h(
                  "div",
                  {
                    className:"eyebrow",
                    style:{color:"var(--accent-soft)"}
                  },
                  "Love Like Jesus"
                ),

                h(
                  "h2",
                  {
                    style:{
                      margin:"0 0 12px",
                      fontSize:"clamp(32px,5vw,52px)",
                      lineHeight:"1.04"
                    }
                  },
                  "Our mission, our witness, and our prayer."
                ),

                h(
                  "p",
                  {
                    style:{
                      margin:"0",
                      color:"rgba(255,255,255,.84)",
                      fontSize:"18px"
                    }
                  },
                  "Learn how this calling shapes the way we worship, welcome, serve, and grow together."
                ),

                h(
                  "div",
                  {className:"btn-row"},

                  h(
                    "span",
                    {className:"btn btn-secondary"},
                    "Learn More"
                  )
                )
              )
            )
          )
        )
      );
    }


    /* =====================================================
       CUSTOM HOMEPAGE BOXES
    ===================================================== */

    const boxes=
      Array.isArray(customBoxes)
        ? customBoxes.filter(box=>
            box && box.enabled!==false
          )
        : [];

    const boxCards=boxes.map(function(box,index){

      const image=box.image
        ? assetURL(box.image)
        : "";

      return h(
        "article",
        {
          className:"cms-custom-card",
          key:"box-"+index
        },

        image
          ? h(
              "div",
              {className:"cms-custom-image"},
              h("img",{
                src:image,
                alt:box.alt || ""
              })
            )
          : null,

        h(
          "div",
          {className:"cms-custom-body"},

          h(
            "h3",
            {},
            box.title || "Homepage Feature"
          ),

          box.text
            ? h("p",{},box.text)
            : null,

          box.button_text
            ? h(
                "div",
                {className:"btn-row"},

                h(
                  "span",
                  {className:"btn btn-dark"},
                  box.button_text
                )
              )
            : null
        )
      );
    });


    const customElement=h(
      "section",
      {className:"cms-custom-section"},

      h(
        "div",
        {className:"container"},

        h(
          "div",
          {className:"eyebrow"},
          "Homepage Features"
        ),

        h(
          "h2",
          {className:"section-title"},
          "Custom Homepage Boxes"
        ),

        boxCards.length
          ? h(
              "div",
              {className:"cms-custom-grid"},
              ...boxCards
            )
          : h(
              "div",
              {className:"empty-custom"},
              "No custom homepage boxes have been added."
            )
      )
    );


    /* =====================================================
       HEADER
    ===================================================== */

    const header=h(
      "header",
      {className:"preview-header"},

      h(
        "div",
        {className:"container preview-nav"},

        h(
          "div",
          {className:"preview-brand"},

          h(
            "div",
            {className:"preview-brand-mark"},
            "V"
          ),

          h(
            "div",
            {className:"preview-brand-text"},

            h(
              "strong",
              {},
              "Versailles UMC"
            ),

            h(
              "span",
              {},
              "Love Like Jesus"
            )
          )
        ),

        h(
          "div",
          {className:"preview-links"},

          h("span",{},"Home"),
          h("span",{},"Watch"),
          h("span",{},"Connect"),
          h("span",{},"Media"),
          h("span",{},"Events"),
          h("span",{},"Give"),

          h(
            "span",
            {className:"preview-watch"},
            "Watch Live"
          )
        )
      )
    );


    return h(
      "main",
      {className:"vumc-preview"},

      header,
      heroElement,
      communityElement,
      protectedSections,
      whoElement,
      customElement
    );
  }
});


CMS.registerPreviewTemplate(
  "home",
  HomePreview
);
</script>
</head>

</html>
