<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VUMC Watch Live</title>

<script src="https://js.churchcenter.com/modal/v1"></script>

<style>
body{
  margin:0;
  background:#0f1115;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

#playerWrap{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

/* PLAYER */
iframe{
  width:100%;
  height:100%;
  border:0;
}

/* SIDEBAR */
#chatLiveWrap,
#chatClosedWrap{
  padding:20px;
}

.vumcHidden{
  display:none!important;
}

button{
  background:#d4af37;
  border:0;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- VIDEO PLAYER (NO OVERLAY AT ALL) -->
<div id="playerWrap">
  <iframe
    src="https://www.youtube.com/embed/live_stream?channel=UC_svgodM3blLqWEBQ5yNjmA&autoplay=1&mute=1&rel=0"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>

<!-- CHAT -->
<div id="chatLiveWrap" class="vumcHidden">
  <h2>Live Chat</h2>
  <div id="chatMessages"></div>

  <input id="chatName" placeholder="Your name" style="width:100%;margin-top:10px;padding:8px;">
  <textarea id="chatMessage" placeholder="Type message..." style="width:100%;margin-top:10px;padding:8px;"></textarea>
  <button onclick="sendChat()">Send</button>
</div>

<div id="chatClosedWrap">
  <h2>Chat Opens During Worship</h2>
</div>

<script>
const CHAT_BACKEND_URL = "https://script.google.com/macros/s/AKfycbzWN8Xi7xUFa_gjg4XHuD_yEEkaKLwrnXFI8d_XQMW4-KQRUlVPVmxcjfcgC0gMNMewsg/exec";

let isActuallyLive = false;

/* SUNDAY FALLBACK */
function isSundayServiceWindow(){
  const now = new Date();
  const day = now.getDay();
  const minutes = now.getHours()*60 + now.getMinutes();
  return day === 0 && minutes >= 570 && minutes <= 720;
}

/* ALWAYS WORK */
function shouldOpenLiveChat(){
  return isActuallyLive || isSundayServiceWindow();
}

/* CHECK LIVE */
async function checkLive(){
  try{
    const res = await fetch(CHAT_BACKEND_URL + "?action=status&t=" + Date.now());
    const data = await res.json();
    isActuallyLive = !!data.live;
  }catch(e){
    isActuallyLive = false;
  }
}

/* CHAT UI */
function updateUI(){
  const open = shouldOpenLiveChat();

  document.getElementById("chatLiveWrap").classList.toggle("vumcHidden", !open);
  document.getElementById("chatClosedWrap").classList.toggle("vumcHidden", open);
}

/* LOAD MESSAGES */
async function loadChat(){
  if(!shouldOpenLiveChat()) return;

  try{
    const res = await fetch(CHAT_BACKEND_URL + "?action=getMessages&t=" + Date.now());
    const data = await res.json();

    const box = document.getElementById("chatMessages");
    box.innerHTML = "";

    (data.messages || []).forEach(m=>{
      const div = document.createElement("div");
      div.style.marginBottom = "10px";
      div.innerHTML = "<strong>"+(m.name||"Guest")+"</strong>: "+(m.message||"");
      box.appendChild(div);
    });

  }catch(e){}
}

/* SEND MESSAGE */
async function sendChat(){
  const name = document.getElementById("chatName").value || "Guest";
  const message = document.getElementById("chatMessage").value;

  if(!message) return;

  document.getElementById("chatMessage").value = "";

  await fetch(CHAT_BACKEND_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({
      action:"postMessage",
      name,
      message
    })
  });

  setTimeout(loadChat,500);
}

/* LOOP */
async function refresh(){
  await checkLive();
  updateUI();
  loadChat();
}

refresh();
setInterval(refresh,60000);
setInterval(loadChat,10000);
</script>

</body>
</html>
