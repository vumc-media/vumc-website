<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facility Rental Request | Versailles UMC</title>

<style>
body {
  font-family: Arial;
  margin:0;
  background:#f7f4ed;
}

.hero {
  background:#52787c;
  color:white;
  padding:40px;
  text-align:center;
}

.wrap {
  max-width:900px;
  margin:auto;
  padding:20px;
}

form {
  background:white;
  padding:25px;
  border-radius:12px;
}

label { display:block; margin-top:15px; font-weight:bold; }
input, textarea, select {
  width:100%;
  padding:10px;
  margin-top:5px;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button {
  margin-top:25px;
  padding:15px;
  background:#52787c;
  color:white;
  border:none;
  width:100%;
  font-size:18px;
}

.success, .error {
  display:none;
  padding:15px;
  margin-bottom:20px;
}

.success { background:#d4edda; }
.error { background:#f8d7da; }

@media(max-width:600px){
  .grid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="hero">
  <h1>Facility Use Reservation Form</h1>
</div>

<div class="wrap">

<div id="success" class="success">Request submitted successfully.</div>
<div id="error" class="error">Something went wrong.</div>

<form
action="https://script.google.com/macros/s/AKfycbysdlnyT75KPMR-KSU9mwMuoQdKs6NehWGEwGmw5Z85BW211HvPi8yVO6yAauZz62E38Q/exec"
method="POST"
target="hidden_iframe"
>

<label>Name of Responsible Party</label>
<input name="responsibleName" required>

<label>Name of Organization</label>
<input name="organization">

<label>VUMC Member</label>
<select name="member">
<option>Yes</option>
<option>No</option>
</select>

<label>Address</label>
<input name="address">

<div class="grid">
<div>
<label>Phone</label>
<input name="phone">
</div>
<div>
<label>Email</label>
<input name="email">
</div>
</div>

<label>Purpose</label>
<textarea name="purpose"></textarea>

<label>Date(s)</label>
<input name="eventDates">

<div class="grid">
<div>
<label>Start Time</label>
<input name="startTime">
</div>
<div>
<label>End Time</label>
<input name="endTime">
</div>
</div>

<label>Time Facility Should Be Ready</label>
<input name="readyTime">

<label>Number Attending</label>
<input name="attendance">

<h3>Pavilion</h3>
<input name="pavilion" placeholder="Yes / No">
<input name="pavilionKitchen" placeholder="Kitchen">
<input name="tables" placeholder="Tables">
<input name="tableQty" placeholder="Table Quantity">
<input name="tableSize" placeholder="8ft / 6ft">
<input name="chairsQty" placeholder="Chairs Quantity">

<h3>Church Areas</h3>
<input name="sanctuary" placeholder="Sanctuary">
<input name="kitchen" placeholder="Kitchen">
<input name="atrium" placeholder="Atrium">
<input name="conference" placeholder="Conference Room">
<input name="youth" placeholder="Youth Room">
<input name="children" placeholder="Children's Room">
<input name="classrooms" placeholder="Classrooms">
<input name="roomNumbers" placeholder="Room Numbers">

<h3>Tables</h3>
<input name="roundTables" placeholder="Round Tables Quantity">
<input name="rectTables" placeholder="Rectangular Tables Quantity">
<input name="rectSize" placeholder="8ft / 6ft">

<label>Sound System</label>
<input name="sound">

<label>Other</label>
<textarea name="other"></textarea>

<label>
<input type="checkbox" name="agreement" required>
 I agree this is a request, not a confirmed reservation
</label>

<button type="submit">Submit Request</button>

</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

</div>

<script>
const params = new URLSearchParams(window.location.search);

if(params.get("submitted")) {
  document.getElementById("success").style.display = "block";
}

if(params.get("error")) {
  document.getElementById("error").style.display = "block";
}
</script>

</body>
</html>
