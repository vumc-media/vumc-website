<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watch Worship Online | Versailles United Methodist Church</title>
<meta name="description" content="Watch Versailles United Methodist Church live online and join us for worship each Sunday." />

<script src="https://js.churchcenter.com/modal/v1"></script>

<style>
/* KEEP ALL YOUR ORIGINAL CSS EXACTLY AS IS ABOVE */

/* ADD ONLY THIS BELOW */

/* PLAYER OVERLAY */
#playerOverlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;

  background:
    linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.72)),
    radial-gradient(circle at center, rgba(48,95,114,0.20), transparent 55%);

  transition: opacity 0.6s ease, visibility 0.6s ease;
}

#playerOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.overlayContent {
  text-align: center;
  max-width: 540px;
  padding: 28px 24px;
  border-radius: 20px;
  background: rgba(10,14,22,0.72);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
  color: #fff;
}

.overlayEyebrow {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .14em;
  margin-bottom: 10px;
  color: #d4af37;
  font-weight: 700;
}

.overlayTitle {
  font-size: 30px;
  font-weight: 800;
  margin-bottom: 10px;
}

.overlayText {
  font-size: 16px;
  margin-bottom: 12px;
  opacity: .92;
}

.overlayTimes {
  font-size: 15px;
  font-weight: 700;
}
</style>
</head>

<body>

<!-- KEEP HEADER + HERO EXACTLY SAME -->

<main>
  <section class="section" id="watch-experience">
    <div class="container">

      <div class="app-shell">
        <div id="vumcFrame" style="position:relative;">

          <iframe
            id="vumcLiveFrame"
            src="https://www.youtube.com/embed/live_stream?channel=UC_svgodM3blLqWEBQ5yNjmA&autoplay=1&mute=1&rel=0&playsinline=1"
            allowfullscreen>
          </iframe>

          <!-- OVERLAY ADDED -->
          <div id="playerOverlay">
            <div class="overlayContent">
              <div class="overlayEyebrow">VUMC eCampus</div>
              <div class="overlayTitle">Worship With Us</div>
              <div class="overlayText">
                Join our online community and worship with us each Sunday.
              </div>
              <div class="overlayTimes">
                Sundays • 9:30 AM & 10:30 AM
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </section>
</main>

<!-- KEEP FOOTER EXACTLY SAME -->

<script>
/* KEEP YOUR EXISTING SCRIPT */

/* ADD ONLY THIS BELOW */

function isSundayServiceWindow() {
  const now = new Date();
  const day = now.getDay();
  const minutes = now.getHours() * 60 + now.getMinutes();

  // 9:27 AM (567) to 12:00 PM (720)
  return day === 0 && minutes >= 567 && minutes <= 720;
}

function updateOverlay() {
  const overlay = document.getElementById("playerOverlay");
  if (!overlay) return;

  if (isSundayServiceWindow()) {
    overlay.classList.add("hidden");
  } else {
    overlay.classList.remove("hidden");
  }
}

updateOverlay();
setInterval(updateOverlay, 60000);
</script>

</body>
</html>
